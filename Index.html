
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
}

.box {
  width: 220px;
  height: 90px;
  padding: 3px;
  border-radius: 13px;
  background: conic-gradient(
    from 0deg,
    #ff0000, #ff7777, #500000, #ff0000
  );
  animation: rotate 3s linear infinite;
  box-shadow: 0 0 12px #ff0000;
}

.inner {
  width: 100%;
  height: 100%;
  border-radius: 10px;
  background: #000000;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
}

.heading {
  color: #ff3030;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 4px;
}

.count {
  color: #ffffff;
  font-size: 34px;
  font-weight: 900;
  min-height: 39px;
  text-shadow: 0 0 10px #ffffff;
  animation: pulse 1.8s ease-in-out infinite;
}

@keyframes rotate {
  to { filter: hue-rotate(360deg); }
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.07); }
}
</style>
</head>

<body>
<div class="box">
  <div class="inner">
    <div class="heading">SUBSCRIBE</div>
    <div class="count" id="count"></div>
  </div>
</div>

</body>
</html>
